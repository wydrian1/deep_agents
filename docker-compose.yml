# The production database is an EXTERNAL Postgres: set DATABASE_URL in .env.
# The "dev" profile only adds a throwaway local Postgres for trying things out:
#   docker compose --profile dev up --build
#   (and use DATABASE_URL=postgresql://deep_agents:deep_agents@postgres:5432/deep_agents)
services:
  app:
    build: .
    env_file: .env
    ports:
      # No login/UI protection yet: publish on loopback only.
      - "127.0.0.1:8000:8000"
    volumes:
      - agents-data:/data
    # Each run is a worker process inside this container; cap and harden the whole service.
    pids_limit: 512
    mem_limit: ${APP_MEM_LIMIT:-2g}   # workers share it; set what fits your host
    cpus: ${APP_CPUS:-2}
    read_only: true                    # only /data and /tmp are writable
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Egress is NOT restricted here. For a real network boundary run the service on a network whose only route
    # out is your egress proxy / the LiteLLM gateway and the database (see docs/ARCHITECTURE.md, "Isolation").
    restart: unless-stopped

  postgres:
    profiles: ["dev"]
    image: postgres:16
    environment:
      POSTGRES_USER: deep_agents
      POSTGRES_PASSWORD: deep_agents
      POSTGRES_DB: deep_agents
    volumes:
      - dev-postgres:/var/lib/postgresql/data

volumes:
  agents-data:
  dev-postgres:

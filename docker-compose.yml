# The production database is an EXTERNAL Postgres: set DATABASE_URL in .env.
# The "dev" profile only adds a throwaway local Postgres for trying things out:
#   docker compose --profile dev up --build
#   (and use DATABASE_URL=postgresql://deep_agents:deep_agents@postgres:5432/deep_agents)
services:
  app:
    build: .
    env_file: .env
    ports:
      # No login/UI protection yet: publish on loopback only.
      - "127.0.0.1:8000:8000"
    volumes:
      - agents-data:/data
    # Each run is a worker process inside this container; cap the whole service.
    pids_limit: 512
    # mem_limit: 2g   # set a limit that fits your host (workers share it)
    restart: unless-stopped

  postgres:
    profiles: ["dev"]
    image: postgres:16
    environment:
      POSTGRES_USER: deep_agents
      POSTGRES_PASSWORD: deep_agents
      POSTGRES_DB: deep_agents
    volumes:
      - dev-postgres:/var/lib/postgresql/data

volumes:
  agents-data:
  dev-postgres:

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI typecheck, tests and build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build   # writes the UI into the Python package
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: docker build -t deep-agents-app:ci .
      - name: Browser tests (Playwright against the running service, test-mode agents)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DATABASE_SCHEMA: e2e
          ALLOW_TEST_MODE: "true"
          RUN_MODE: process
          DATA_DIR: ${{ runner.temp }}/e2e-data
        run: |
          uvicorn deep_agents_app.main:app --port 8000 > "$RUNNER_TEMP/e2e-server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          cd ui
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Show the service log when the browser tests failed
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/e2e-server.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
